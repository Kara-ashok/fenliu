[custom]
;不要随意改变关键字，否则会导致出错
;ACL4SSR规则-三层场景优化版（适用于OpenClash/subconverter）

;去广告：支持
;自动测速：不作为主要选择方式
;微软分流：不支持
;苹果分流：不支持
;增强中国IP段：不支持
;增强国外GFW：不支持
;结构：业务层 -> 场景层 -> 手动节点槽位 -> 实际节点

; ==================================================
; 规则集：顺序越靠前，匹配优先级越高
; ==================================================
ruleset=🌐 DNS,https://raw.githubusercontent.com/Kara-ashok/fenliu/refs/heads/main/DNS.list
