ruleset=🎵 TikTok,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/TikTok/TikTok.list
ruleset=🌍 国外媒体,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyMedia.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyLite.list

ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list
;ruleset=🎯 全球直连,[]GEOIP,LAN
ruleset=🎯 全球直连,[]GEOIP,CN
ruleset=🐟 漏网之鱼,[]FINAL

; ==================================================
; 第一层：六个手动节点槽位
; 六组均显示全部节点，选择状态互相独立
; 排除名称中含“链式本地”的私有节点
; ==================================================
custom_proxy_group=🚀 常规节点`select`^(?!.*链式本地).*
custom_proxy_group=🐘 大流量节点`select`^(?!.*链式本地).*
custom_proxy_group=🤖 AI解锁节点`select`^(?!.*链式本地).*
custom_proxy_group=🌏 地区节点一`select`^(?!.*链式本地).*
custom_proxy_group=🌎 地区节点二`select`^(?!.*链式本地).*
custom_proxy_group=🏢 机场专用节点`select`^(?!.*链式本地).*

; 如以后恢复链式拨号，可取消注释并按实际节点名调整
;custom_proxy_group=🔀 拨号开关`select`[]DIRECT`[]链式本地

; ==================================================
; 第二层：六个场景总控
; 只引用第一层节点槽位，不引用任何第三层业务组
; ==================================================
custom_proxy_group=🚀 常规挂梯`select`[]🚀 常规节点`[]🐘 大流量节点`[]🌏 地区节点一`[]🌎 地区节点二`[]🏢 机场专用节点`[]DIRECT
custom_proxy_group=🐘 大流量挂梯`select`[]🐘 大流量节点`[]🚀 常规节点`[]🌏 地区节点一`[]🌎 地区节点二`[]🏢 机场专用节点`[]DIRECT
custom_proxy_group=🧠 AI网络`select`[]🤖 AI解锁节点`[]🌏 地区节点一`[]🌎 地区节点二`[]🏢 机场专用节点`[]🚀 常规节点
custom_proxy_group=🗾 地区网络一`select`[]🌏 地区节点一`[]🌎 地区节点二`[]🚀 常规节点`[]🐘 大流量节点`[]🤖 AI解锁节点`[]🏢 机场专用节点`[]DIRECT
custom_proxy_group=🗽 地区网络二`select`[]🌎 地区节点二`[]🌏 地区节点一`[]🚀 常规节点`[]🐘 大流量节点`[]🤖 AI解锁节点`[]🏢 机场专用节点`[]DIRECT
custom_proxy_group=🏢 机场网络`select`[]🏢 机场专用节点`[]🚀 常规节点`[]🐘 大流量节点`[]🌏 地区节点一`[]🌎 地区节点二`[]🤖 AI解锁节点`[]DIRECT

; ==================================================
; 第三层：具体业务
; 第一项为默认场景，其他场景用于临时覆盖
; ==================================================

; 通用代理入口：对应ProxyLite规则，保留熟悉的“节点选择”名称
custom_proxy_group=🚀 节点选择`select`[]🚀 常规挂梯`[]🐘 大流量挂梯`[]🧠 AI网络`[]🗾 地区网络一`[]🗽 地区网络二`[]🏢 机场网络`[]DIRECT

; 基础设施与网络分类
custom_proxy_group=🌐 DNS`select`[]🚀 常规挂梯`[]🧠 AI网络`[]🗾 地区网络一`[]🗽 地区网络二`[]🏢 机场网络`[]DIRECT
custom_proxy_group=☁️ CloudFlareCDN`select`[]🚀 常规挂梯`[]🐘 大流量挂梯`[]🗾 地区网络一`[]🗽 地区网络二`[]🏢 机场网络`[]DIRECT
custom_proxy_group=🕹️ 游戏`select`[]🚀 常规挂梯`[]DIRECT`[]🐘 大流量挂梯`[]🗾 地区网络一`[]🗽 地区网络二`[]🏢 机场网络
custom_proxy_group=🎮 直连`select`[]DIRECT`[]🚀 常规挂梯`[]🐘 大流量挂梯`[]🧠 AI网络`[]🗾 地区网络一`[]🗽 地区网络二`[]🏢 机场网络

; 普通挂梯业务
custom_proxy_group=🎵 TikTok`select`[]🚀 常规挂梯`[]🐘 大流量挂梯`[]🧠 AI网络`[]🗾 地区网络一`[]🗽 地区网络二`[]🏢 机场网络`[]DIRECT
custom_proxy_group=📲 电报消息`select`[]🚀 常规挂梯`[]🐘 大流量挂梯`[]🧠 AI网络`[]🗾 地区网络一`[]🗽 地区网络二`[]🏢 机场网络`[]DIRECT
custom_proxy_group=📚 漫画`select`[]🗾 地区网络一`[]🚀 常规挂梯`[]🐘 大流量挂梯`[]🧠 AI网络`[]🗽 地区网络二`[]🏢 机场网络`[]DIRECT
custom_proxy_group=📚 漫画je`select`[]🚀 常规挂梯`[]🐘 大流量挂梯`[]🧠 AI网络`[]🗾 地区网络一`[]🗽 地区网络二`[]🏢 机场网络`[]DIRECT

; 视频与大流量业务：默认走大流量场景
custom_proxy_group=📹 YouTube`select`[]🐘 大流量挂梯`[]🚀 常规挂梯`[]🧠 AI网络`[]🗾 地区网络一`[]🗽 地区网络二`[]🏢 机场网络`[]DIRECT
custom_proxy_group=📺 Twitch`select`[]🐘 大流量挂梯`[]🚀 常规挂梯`[]🧠 AI网络`[]🗾 地区网络一`[]🗽 地区网络二`[]🏢 机场网络`[]DIRECT
custom_proxy_group=🌍 国外媒体`select`[]🐘 大流量挂梯`[]🚀 常规挂梯`[]🧠 AI网络`[]🗾 地区网络一`[]🗽 地区网络二`[]🏢 机场网络`[]DIRECT

; Emby业务：规则由OpenClash本地规则或其他本地覆写引用
; 直连组默认DIRECT，同时允许临时切换到各代理场景
custom_proxy_group=🎬 emby直连`select`[]DIRECT`[]🐘 大流量挂梯`[]🚀 常规挂梯`[]🗾 地区网络一`[]🗽 地区网络二`[]🏢 机场网络`[]🧠 AI网络

; 挂梯组默认使用大流量场景
custom_proxy_group=🎬 emby挂梯`select`[]🐘 大流量挂梯`[]🚀 常规挂梯`[]🗾 地区网络一`[]🗽 地区网络二`[]🏢 机场网络`[]🧠 AI网络`[]DIRECT

; 可选组默认使用大流量场景，可快速切换DIRECT
custom_proxy_group=🎬 emby可选直连挂梯`select`[]DIRECT`[]🐘 大流量挂梯`[]🚀 常规挂梯`[]🗾 地区网络一`[]🗽 地区网络二`[]🏢 机场网络`[]🧠 AI网络

; Cloudflare CDN组默认进入CloudFlareCDN业务策略
custom_proxy_group=🎬 emby cfcdn的`select`[]DIRECT`[]☁️ CloudFlareCDN`[]🐘 大流量挂梯`[]🚀 常规挂梯`[]🗾 地区网络一`[]🗽 地区网络二`[]🏢 机场网络

; AI业务：默认走AI网络，不提供DIRECT以减少误选
custom_proxy_group=🤖 OpenAi`select`[]🧠 AI网络`[]🚀 常规挂梯`[]🐘 大流量挂梯`[]🗾 地区网络一`[]🗽 地区网络二`[]🏢 机场网络
custom_proxy_group=🧠 Google AI`select`[]🧠 AI网络`[]🚀 常规挂梯`[]🐘 大流量挂梯`[]🗾 地区网络一`[]🗽 地区网络二`[]🏢 机场网络
custom_proxy_group=🔎 Google相关`select`[]🚀 常规挂梯`[]🧠 AI网络`[]🐘 大流量挂梯`[]🗾 地区网络一`[]🗽 地区网络二`[]🏢 机场网络`[]DIRECT

; 国内、直连与兜底业务
custom_proxy_group=🎬 哔哩哔哩`select`[]DIRECT`[]🚀 常规挂梯`[]🐘 大流量挂梯`[]🧠 AI网络`[]🗾 地区网络一`[]🗽 地区网络二`[]🏢 机场网络
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🚀 常规挂梯`[]🐘 大流量挂梯`[]🧠 AI网络`[]🗾 地区网络一`[]🗽 地区网络二`[]🏢 机场网络
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 常规挂梯`[]🐘 大流量挂梯`[]🧠 AI网络`[]🗾 地区网络一`[]🗽 地区网络二`[]🏢 机场网络`[]DIRECT`[]REJECT
custom_proxy_group=🛑 广告拦截`select`[]REJECT`[]DIRECT

enable_rule_generator=true
overwrite_original_rules=true
